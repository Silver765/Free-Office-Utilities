<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' data: blob:; object-src 'none'">
<title>Silver PDF Pro</title>
<link rel="stylesheet" href="vendor/pdf_viewer.css">
<link rel="stylesheet" href="styles.css">
</head>
<body data-tool="select" data-theme="dark">
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo">S</span><span class="brand-name">Silver PDF Pro</span></div>
    <nav id="menubar"></nav>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn" title="Toggle light/dark theme"></button>
  </header>
  <div id="tabs"></div>
  <div id="toolbar">
    <div class="tb-group" id="tbFile"></div>
    <div class="tb-group" id="tbNav"></div>
    <div class="tb-group" id="tbZoom"></div>
    <div class="tb-group" id="tbTools"></div>
    <div class="spacer"></div>
    <div class="tb-group" id="tbSearch"></div>
  </div>
  <div id="propbar"></div>
  <div id="main">
    <aside id="rail"></aside>
    <aside id="leftpane"><div id="leftpane-head"></div><div id="leftpane-body"></div></aside>
    <section id="viewer">
      <div id="scroller"><div id="pages"></div></div>
      <div id="welcome"></div>
      <div id="findbar" hidden></div>
      <div id="dropveil" hidden>Drop PDF files to open</div>
    </section>
    <aside id="toolspane"></aside>
  </div>
  <footer id="statusbar"><span id="stDoc"></span><span class="spacer"></span><span id="stInfo"></span></footer>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="ctxMenu" hidden></div>
<div id="printRoot"></div>
<input type="file" id="filePicker" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="imagePicker" accept="image/*" hidden>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/fontkit.umd.min.js"></script>
<script src="vendor/tesseract/tesseract.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
